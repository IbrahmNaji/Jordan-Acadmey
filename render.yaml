
services:
  - type: web
    name: academy-crm-api
    runtime: node
    rootDir: server
    region: frankfurt
    plan: free
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    startCommand: npm run db:deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24.21.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: academy-crm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: TRUST_PROXY
        value: "true"
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_SAMPLE_DATA
        value: "false"

  - type: web
    name: academy-crm-site
    runtime: static
    rootDir: client
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    autoDeployTrigger: "off"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "24.21.0"
      - key: VITE_API_URL
        sync: false
      - key: VITE_SITE_URL
        sync: false

databases:
  - name: academy-crm-db
    databaseName: academy_crm
    user: academy_crm_user
    postgresMajorVersion: "17"
    region: frankfurt
    plan: free
    ipAllowList: []
