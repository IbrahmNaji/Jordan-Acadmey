# Frankfurt is selected for regional latency; Render regions cannot be changed after creation.
# Review the paid plans and any cost in Render before creating these resources.
# This file does not provision or deploy anything until you sync and confirm it.
services:
  - type: web
    name: academy-crm-api
    runtime: node
    rootDir: server
    region: frankfurt
    plan: free # Free web-service plan; it spins down after inactivity.
    autoDeployTrigger: 'off'
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    preDeployCommand: npm run db:deploy
    initialDeployHook: npm run db:seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24.21.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: academy-crm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        # Enter the website HTTPS origin only, without a trailing slash.
        sync: false
      - key: TRUST_PROXY
        value: "true"
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_SAMPLE_DATA
        value: "false"

  - type: web
    name: academy-crm-site
    runtime: static
    rootDir: client
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    autoDeployTrigger: 'off'
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "24.21.0"
      - key: VITE_API_URL
        # Enter the API's public HTTPS URL ending in /api.
        sync: false
      - key: VITE_SITE_URL
        # Enter the website HTTPS origin only, without a trailing slash.
        sync: false

databases:
  - name: academy-crm-db
    databaseName: academy_crm
    user: academy_crm_user
    postgresMajorVersion: "17"
    region: frankfurt
    plan: free # Free PostgreSQL plan; it expires after 30 days and has no backups.
    ipAllowList: []
